name: Deploy consent page

on:
  push:
    branches: [main]
    paths:
      - "join/**"
      - "assets/codex-micro-glass-hero.png"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble consent page
        run: |
          mkdir -p _site/join _site/assets
          cp join/index.html _site/join/index.html
          cp assets/codex-micro-glass-hero.png _site/assets/codex-micro-glass-hero.png
          touch _site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
